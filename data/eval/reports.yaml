# The reading test set (m86): 40 made-up reports written the way people really send them — English, Hinglish,
# Hindi in Devanagari, forwards, typos, no punctuation — each with the facts a person reads from it.
# Labels were written BEFORE running the word rules on them. All people, villages-as-used and phone numbers are
# synthetic. `make read-eval` scores the word rules field by field against these labels.
#
# Fields (omit a field = expect nothing): people (int), hazards / needs / vulnerable (closed lists, as sets),
# village (Latin spelling, case-insensitive), landmarks (types, as a set), phone (10 digits), on_site (true/false).

reports:
