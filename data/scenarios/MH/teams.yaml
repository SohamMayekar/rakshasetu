# Teams deployed for the Mumbai floods (PRD F-C4). Synthetic names for real kinds of team (NDRF pre-positions teams in
# Mumbai each monsoon; the fire brigade, SDRF, police, Aapda Mitra volunteers and Koli fishermen's boats all do flood
# rescue). The fire brigade's agency is the schema's "Fire & Rescue". Positions are near real places; position_age_min makes "position 20 min old" honest.
# has_app: false = radio-only (the timer *is* the radio schedule).
teams:
