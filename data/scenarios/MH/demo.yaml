# The performed demo (docs/DEMO.md): its scripted inputs and a reset point per step (F-C12).
# `make demo-reset SCENE=<id>` seeds, then replays every step BEFORE <id> through the real API as the people
# who do it on stage, so the desk shows exactly what it would at that moment.
# All people, phones and devices are synthetic.

incident: MH
operator: spatil               # the duty officer on the projector desk (http://localhost): S. Patil
team_lead: fb5                 # the rescue team's phone: Fire Brigade Boat 5

son:                           # 0:00 the son, at work in Andheri, asks for his family in Kurla West
  clip: clips/son-line.synthetic.ogg
  device_id: demo-son-phone-0001   # the son's phone after a reset (his status page opens as it)

forward:                       # 0:50 a neighbour's WhatsApp forward, pasted by the officer
  text: "Ramesh Patil's family is in Kurla West, behind the Shankar mandir, near the bridge. 6 people are stuck on the roof, there is a lot of water."
  phone: "+91 98765 70002"
das:                           # 1:05 a different family, same area and headcount: refused (Rajesh ≠ Ramesh)
  text: "Rajesh Patil, 5 people, Kurla West, near the temple, stuck on the roof"
  phone: "+91 98765 70003"
sheet: sheet/volunteer_sheet.csv   # 1:15

radio_team: "NDRF Boat 2"      # 1:45 radio only; "Acknowledged on radio · VHF · ETA 15 min"
radio: {channel: VHF, eta_minutes: 15}
reassign_to: "Fire Brigade Boat 5"

trips:                         # 2:30 the rescue sheet on the team's phone
  - {eta_minutes: 15, people_taken: 4, anyone_left: "yes"}   # ETA is a chip: 15, 30 or 60
  - {eta_minutes: 15, people_taken: 2, anyone_left: "no"}
family_answer: "yes"

scenes:                        # in order; "at" is the time in the performed run
  - {id: son,      at: "0:00", title: "A family asks for help", starts_with: "the seed only: the son sends the line"}
  - {id: merge,    at: "0:50", title: "The same family, twice", starts_with: "the son's case (the recorded clip played through the pipeline)"}
  - {id: sheet,    at: "1:15", title: "A volunteer's sheet",    starts_with: "+ the forward merged and checked, the Rajesh Patil report kept apart"}
  - {id: stale,    at: "1:45", title: "A team goes quiet",      starts_with: "+ the 300-row sheet imported"}
  - {id: rescue,   at: "2:30", title: "The rescue",             starts_with: "+ Boat 2 acknowledged on radio, went quiet, and the case moved to Boat 5"}
  - {id: receipts, at: "3:05", title: "Proof",                  starts_with: "+ two trips: 4 taken, then 2, rescued 6 of 6, the family said yes"}
