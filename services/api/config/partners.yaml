# One row per partner (PRD §11.4). Adding a partner is a config row, not code. `enabled` is the kill switch.
partners:
  - id: demo-partner
    team: "Demo partner (simulated by RakshaSetu)"
    domain: test
    secret_env: PARTNER_DEMO_SECRET
    scopes: [report.submit, partner.annotate]
    subscriptions: [report.created, evidence.created, case.updated, audit.head]
    webhook_url_env: DEMO_PARTNER_WEBHOOK_URL   # empty: nothing goes out; `make webhook-sink` shows a receiver
    incidents: [BR, OD, HP]
    rate_per_min: 600
    enabled: true
  - id: surge-generator
    team: "RakshaSetu surge generator (synthetic load, app/surge.py)"
    domain: test
    secret_env: PARTNER_DEMO_SECRET
    scopes: [report.submit]
    subscriptions: []
    incidents: [BR, OD, HP]
    rate_per_min: 6000
    enabled: true
    lane: surge
