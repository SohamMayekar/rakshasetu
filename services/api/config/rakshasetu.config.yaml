# RakshaSetu team-owned configuration (PRD §9). THE file judges will probe.
# The team decides every number here and every member can explain it.
# Durations: 30s, 5m, 2h. Distances in metres unless the key says km.
profile: demo                      # demo | realistic

dedupe:
  score: weighted_sum_missing_zero   # only agreeing signals add; missing = 0 (no averaging)
  weights: {phone_or_device: 0.30, place: 0.20, geo: 0.20, landmarks: 0.10, headcount: 0.10, names: 0.05, time: 0.05}
  name_tokens: true                # a shared surname alone = 0; differing given names = conflict → refused
  min_signals: 2                   # non-time signals required, incl. place or geo
  suggest_at: 0.60
  auto_merge_at: 0.85              # AND phone/device match AND place/geo agree AND no conflict
  relay_phone_distinct_households: 2   # a phone/device stops counting as identity after this
  block: {high_conf_distance_km_gt: 2}  # same phone → review instead (the family may have moved)
  geo_min_confidence: medium
  reject_creates_block: true
  transitive_merges: false
  candidate_cap: 50                # applied after ranking: phone/device → distance → village
  candidate_radius_km: 3
  time_decay_hours: 12
  include_closed_hours: 72         # P1: old forwards can't resurrect rescued families

location:
  landmark_search_radius_m: 2000
  pair_max_gap_m: 500              # P1: candidates further apart are never averaged
  high_requires_unique_pair_within_m: 1000
  radius_m: {two_landmarks: 150, one_landmark: 300, many_candidates_cap: 1000, village: 1500, district: 15000, human: 50}
  village_fuzzy_min: 85            # rapidfuzz ratio for a village name match

priority:                          # highest matching level wins; every matching reason at that level is shown
  - {level: P1, when: "trapped and (water_rising or water_entering or medical_urgent)", reason: "trapped + water/urgent medical"}
  - {level: P1, when: "(buried or structure_collapsed) and people_count >= 1", reason: "buried / collapse"}
  - {level: P1, when: "trapped and vulnerable", reason: "trapped + vulnerable person"}
  - {level: P1, when: "medical_urgent", reason: "urgent medical need"}
  - {level: P1, when: "people_count >= 10 and trapped", reason: "10+ people trapped"}
  - {level: P1, when: "fire or smoke_gas", reason: "fire or gas: people at risk"}
  - {level: P1, when: "road_accident and (injured or medical_urgent)", reason: "accident with injured people"}
  - {level: P1, when: "earthquake and (trapped or buried or structure_collapsed or injured)", reason: "earthquake: trapped or hurt"}
  - {level: P2, when: "road_accident or earthquake or wind_damage", reason: "accident, quake or storm damage: check"}
  - {level: P2, when: "trapped or medicine or vulnerable", reason: "trapped, medicine or vulnerable"}
  - {level: P3, when: "needs_supplies", reason: "supplies"}
  - {level: P4, when: "true", reason: "no urgent signal yet: check"}
p1_order: [infant_or_medical_urgent, water_rising, vulnerable, waiting_time]   # partial rescues keep their original time

contact:          # realistic values; the demo profile runs the clock ×60 for live demo cases only
  acknowledge_within: {P1: 5m, P2: 10m, P3: 30m, P4: 30m}
  eta_chips: [15m, 30m, 60m]                             # the team's own estimate
  eta_grace: 10m
  onscene_window: 30m
  long_operation_window: 120m                            # collapse, a large site
  heartbeat_extends_deadline: false                      # display only ("last seen")
  team_level_contact: true                               # one radio log refreshes all of a team's assignments
  demo_clock_multiplier: 60                              # shown on every ring in the demo profile
  rescue_review_window: 2h                               # rescued → closed unless a blocking "No"
  demo_rescue_review_window: 20s                         # demo profile, live demo cases (real seconds)
dispatch:
  p1_before_check: true                                  # nobody on a roof waits for paperwork
  exclude_team_status: [overdue, out_of_service]
  top_n: 3

escalation:
  chain: [duty_officer, incharge]                        # stays in the district; routed to the role, never a person
  ack_within: 10m                                        # P1: then rises to the in-charge
  resolve_within: 15m                                    # P1: an acknowledgement that isn't resolved is raised again
  one_per_team: true
  capacity_gap_alert: true                               # P1: one group header, not one alarm per case
  p1_unowned_after: 5m
  seoc_sees: [totals, capacity_requests]

rescue:
  location_check_extra_m: 1000                           # P1: radius + 1 km → no auto-close, officer closes
  other_tell_officer_suppresses_family_messages: true
  undo_seconds: 10

demo:
  incident: MH                             # the live incident: public reports go here unless ?i= says otherwise, and the
                                           # performed demo runs on its pack (data/scenarios/MH/demo.yaml); BR's script stays for the tests
  short_timers_apply_to: live_demo_cases   # seeded cases keep realistic timers: no alarm storm mid-pitch
  sign_in_picker:                          # the 3 profiles on the demo's sign-in screen (D22); every other seeded user stays, off the picker
    - {username: spatil, title: "Duty officer", line: "Runs the Mumbai control room desk"}
    - {username: fb5,    title: "Rescue team",  line: "Fire Brigade Boat 5's phone app"}
    - {username: admin,  title: "State admin",  line: "Sees every disaster the desks are handling"}
  seed_timestamps_relative_to_reset: true
  heartbeat_seconds: 10

surge: {render_batch_ms: 1000, max_case_updates_per_sec: 1}
scheduler: {ticker_seconds: 5, job_reclaim_after: 60s}
lanes: [live_voice, whatsapp_partner, import, surge, backfill]   # claim order; backfill = the LLM re-reading rule-made cases
providers:                         # all free (PRD §12.5); first = primary, second = fallback
  stt: [sarvam_saaras, groq_whisper_large_v3]
  llm: [groq_gpt_oss_120b, gemini_flash]
  geocode: [google_geocoding, photon, nominatim]   # address text → a point. The team's Google key first when
                                   # GOOGLE_MAPS_API_KEY is set (a doorway-level answer); the free OSM services
                                   # (no keys) answer without it and whenever Google is over its cap.
  stop_at_fraction_of_free_cap: 0.8   # then fall back; the LLM's last resort is the keyword path
  language_model_enabled: true        # the "language model off" demo control overrides this at runtime
  free_caps:                          # PRD §12.5, checked 12 Oct 2026 — recheck on hack day
    sarvam_saaras: {calls_per_min: 60, audio_seconds_per_day: 10800}        # ~₹100 credits ≈ 3 h of audio (docs)
    groq_whisper_large_v3: {calls_per_min: 20, calls_per_day: 2000}
    groq_gpt_oss_120b: {calls_per_min: 30, calls_per_day: 1000, tokens_per_min: 8000, tokens_per_day: 200000}
    gemini_flash: {calls_per_min: 10, calls_per_day: 250}                   # UNVERIFIED: recheck the free-tier page
    photon: {calls_per_min: 30, calls_per_day: 1500}                        # public fair-use service, no key
    nominatim: {calls_per_min: 30, calls_per_day: 1000}                     # OSM policy: 1 request/s, real UA
    google_geocoding: {calls_per_min: 50, calls_per_day: 2000}              # the team's own key: tune to its quota
  models:
    sarvam_saaras: saaras:v4
    groq_whisper_large_v3: whisper-large-v3
    groq_gpt_oss_120b: openai/gpt-oss-120b
    gemini_flash: gemini-2.5-flash
llm: {timeout_s: 8, retries: 1, batch_rows: 20, parallel_batches: 1, reasoning_effort: low, live_reserve_tokens_per_min: 3000}
voice_caps: {per_device_per_min: 5, global_per_min: 20, max_clip_seconds: 30, min_clip_seconds: 1.0}
status_page: {poll_seconds: 3, lookups_per_min_per_ip: 60}

# Outbound partner webhooks (PRD §11.4): signed like every partner call; delivered as jobs, retried with backoff.
webhooks: {audit_head_every: 5m, evidence_url_ttl: 15m, timeout_s: 5, max_attempts: 6, batch: 500}
