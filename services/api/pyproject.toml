[project]
name = "rakshasetu-api"
version = "0.1.0"
description = "RakshaSetu: the district control room's rescue-request desk (API, worker, ticker)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "cryptography>=43",
  "httpx>=0.27",
  "indic-transliteration>=2.3",
  "rapidfuzz>=3.9",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "jsonschema>=4.23", "pytest-timeout>=2.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 120
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]
markers = [
  "scenario: the PRD §13.6 field-reality scenario tests T1-T10",
  "slow: tests that start processes or run for seconds",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
