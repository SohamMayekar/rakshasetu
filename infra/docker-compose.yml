# RakshaSetu: the whole stack on one laptop (PRD §12.4).
# Postgres + PostGIS is the only data service. One API image runs as api, worker and ticker.
name: rakshasetu

x-api-env: &api-env
  # api, worker and ticker connect as rakshasetu_app (owns nothing; INSERT+SELECT on events).
  DATABASE_URL: postgresql+psycopg://rakshasetu_app:${APP_DB_PASSWORD}@db:5432/rakshasetu
  # The test harness uses its own database, never the demo one.
  TEST_DATABASE_URL: postgresql+psycopg://rakshasetu_app:${APP_DB_PASSWORD}@db:5432/rakshasetu_test
  TEST_OWNER_DATABASE_URL: postgresql+psycopg://rakshasetu_owner:${OWNER_DB_PASSWORD}@db:5432/rakshasetu_test
  DEMO_MODE: ${DEMO_MODE:-true}
  PUBLIC_URL: ${PUBLIC_URL:-}
  SECRET_KEY: ${SECRET_KEY}
  DATA_DIR: /data
  FILES_DIR: /files
  CONTRACTS_DIR: /contracts

x-api-build: &api-build
  context: ../services/api
  additional_contexts:
    certs: ./certs
    contracts: ../packages/contracts

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      OWNER_DB_PASSWORD: ${OWNER_DB_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"   # localhost only: for tests and psql (the tamper demo)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rakshasetu"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    # One-shot: applies migrations as rakshasetu_owner, then exits.
    build: *api-build
    image: rakshasetu-api
    command: ["python", "-m", "app.migrate"]
    environment:
      OWNER_DATABASE_URL: postgresql+psycopg://rakshasetu_owner:${OWNER_DB_PASSWORD}@db:5432/rakshasetu
    depends_on:
      db: { condition: service_healthy }

  api:
    image: rakshasetu-api
    environment: *api-env
    volumes:
      - ../data:/data:ro
      - files:/files
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    image: rakshasetu-api
    command: ["python", "-m", "app.worker"]
    environment: *api-env
    volumes:
      - ../data:/data:ro
      - files:/files
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/worker.heartbeat) )) -lt 30"]
      interval: 5s
      timeout: 3s
      retries: 10

  ticker:
    image: rakshasetu-api
    command: ["python", "-m", "app.ticker"]
    environment: *api-env
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL", "test $$(( $$(date +%s) - $$(stat -c %Y /tmp/ticker.heartbeat) )) -lt 30"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ../apps/web
      additional_contexts:
        certs: ./certs
    image: rakshasetu-web
    environment:
      API_ORIGIN: http://api:8000
    depends_on:
      api: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: public.ecr.aws/docker/library/caddy:2-alpine
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "127.0.0.1:${LOCAL_PORT:-80}:80"      # local listener: the desk on the projector
      - "127.0.0.1:${PUBLIC_PORT:-8080}:8080" # public listener: point the tunnel here only
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:80/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  files:
